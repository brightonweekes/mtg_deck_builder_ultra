name: Update Card Catalog

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore Scryfall pipeline cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: scryfall-cache-${{ runner.os }}
          restore-keys: |
            scryfall-cache-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Scryfall catalog & paper backfill
        run: npm run build:cards

      - name: Run verification suite
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit and push updated catalog if changed
        id: commit_changes
        run: |
          if [ -z "$(git status --porcelain public/data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes detected; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cards.min.json public/data/manifest.json
          git commit -m "chore(data): nightly Scryfall catalog update"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy hook
        if: steps.commit_changes.outputs.changed == 'true'
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$CF_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$CF_DEPLOY_HOOK"
            echo "Triggered Cloudflare Pages deploy hook."
          else
            echo "CLOUDFLARE_DEPLOY_HOOK_URL secret is not set; skipping deploy hook trigger."
          fi
