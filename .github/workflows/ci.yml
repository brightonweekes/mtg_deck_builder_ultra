name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no secrets or env files are tracked
        run: |
          TRACKED_ENV=$(git ls-files '.env' '.env.*' ':!.env.example')
          TRACKED_KEYS=$(git ls-files '*firebase-adminsdk*.json' 'service-account*.json')
          if [ -n "$TRACKED_ENV" ] || [ -n "$TRACKED_KEYS" ]; then
            echo "Error: Secret or environment files are tracked in git:"
            echo "$TRACKED_ENV"
            echo "$TRACKED_KEYS"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify Cloudflare Pages 25 MiB asset limit
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const LIMIT = 25 * 1024 * 1024;
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else {
                  const size = fs.statSync(full).size;
                  if (size >= LIMIT) {
                    console.error(`ERROR: ${full} (${size} bytes) exceeds 25 MiB limit!`);
                    process.exit(1);
                  }
                }
              }
            }
            walk("dist");
            console.log("All dist/ assets are strictly under 25 MiB.");
          '
